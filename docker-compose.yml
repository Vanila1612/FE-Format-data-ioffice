services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ioffice}
      POSTGRES_USER: ${POSTGRES_USER:-ioffice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ioffice}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ioffice} -d ${POSTGRES_DB:-ioffice}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123456}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-System Admin}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ioffice}:${POSTGRES_PASSWORD:-ioffice}@postgres:5432/${POSTGRES_DB:-ioffice}
      UPLOAD_DIR: /app/storage/uploads
      EXPORT_DIR: /app/storage/exports
      SNAPSHOT_DIR: /app/storage/snapshots
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3001:3001"
    volumes:
      - app_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  app_storage:
