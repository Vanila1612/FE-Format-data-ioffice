services:
  mongo:
    image: mongo:8.0.20
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        if [ ! -f /data/db/keyfile ]; then openssl rand -base64 756 > /data/db/keyfile;
        chmod 400 /data/db/keyfile; chown mongodb:mongodb /data/db/keyfile; fi;
        exec /usr/local/bin/docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /data/db/keyfile
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-ioffice}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-ioffice}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-ioffice}
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username ${MONGO_INITDB_ROOT_USERNAME:-ioffice} --password ${MONGO_INITDB_ROOT_PASSWORD:-ioffice} --authenticationDatabase admin --eval 'db.adminCommand(\"ping\").ok' localhost:27017/admin | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-init:
    image: mongo:8.0.20
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-ioffice}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-ioffice}
    depends_on:
      mongo:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        mongosh --host mongo:27017 --username "$$MONGO_INITDB_ROOT_USERNAME"
        --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --quiet
        --eval 'try { rs.status().ok } catch (error) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]}); }'

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123456}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-System Admin}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}
      DATABASE_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-ioffice}:${MONGO_INITDB_ROOT_PASSWORD:-ioffice}@mongo:27017/${MONGO_INITDB_DATABASE:-ioffice}?authSource=admin&replicaSet=rs0
      UPLOAD_DIR: /app/storage/uploads
      EXPORT_DIR: /app/storage/exports
      SNAPSHOT_DIR: /app/storage/snapshots
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3001:3001"
    volumes:
      - app_storage:/app/storage
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  app_storage:
